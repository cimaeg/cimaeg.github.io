name: جمع الطواقم الكاملة
on:
  workflow_dispatch:
    inputs:
      mode: { default: "run" }
      a: { default: "0" }
      b: { default: "20" }
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python tools/fetch_cast.py ${{ inputs.mode }} ${{ inputs.a }} ${{ inputs.b }}
      - if: inputs.mode == 'run'
        run: |
          mkdir -p /tmp/out && mv cast.jsonl /tmp/out/cast-${{ inputs.a }}.jsonl
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git fetch -q origin castdump && git checkout -q -B castdump origin/castdump || git checkout -q --orphan castdump
          git rm -rq --cached . 2>/dev/null || true
          cp /tmp/out/*.jsonl . && git add cast-*.jsonl && git commit -qm "dump ${{ inputs.a }}" && git push -q origin castdump
