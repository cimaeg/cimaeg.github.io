name: جمع الطواقم الكاملة
on:
  workflow_dispatch:
    inputs:
      mode: { default: "run" }
      a: { default: "0" }
      b: { default: "20" }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python tools/fetch_cast.py ${{ inputs.mode }} ${{ inputs.a }} ${{ inputs.b }}
      - if: inputs.mode == 'run'
        uses: actions/upload-artifact@v4
        with:
          name: cast-${{ inputs.a }}
          path: cast.jsonl
          retention-days: 3
