name: بحث روابط السينما
on:
  workflow_dispatch:
    inputs:
      mode: { default: "run" }
      q: { default: "" }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python tools/find_elc.py ${{ inputs.mode }} "${{ inputs.q }}"
