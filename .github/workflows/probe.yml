name: جمع مواد النبذ
on:
  workflow_dispatch:
    inputs:
      n: { default: "300" }
      skip: { default: "0" }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python tools/fetch_sources.py ${{ inputs.n }} ${{ inputs.skip }}
      - run: python -c "import json;[print('SRC', json.dumps(o, ensure_ascii=False)) for o in json.load(open('sources.json'))]"
