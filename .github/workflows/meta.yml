name: فحص البلد والطاقم
on:
  workflow_dispatch:
    inputs:
      mode: { default: "run" }
      a: { default: "5000" }
      b: { default: "0" }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python tools/fetch_meta.py ${{ inputs.mode }} ${{ inputs.a }} ${{ inputs.b }}
